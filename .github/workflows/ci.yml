name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A superseded run on the same ref tells you nothing, so cancel it rather than
# spending minutes on a commit nobody is looking at any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # AGP 9 requires JDK 17 or newer; the toolchain in this project is pinned to
      # 17 and dav4jvm needs a compiler new enough to read Kotlin 2.4 metadata.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # Installed explicitly rather than assumed: the runner's image carries a
      # different set of platforms, and a missing android-36 fails the build with a
      # message about the SDK rather than about the code.
      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      # Caches the Gradle distribution, dependency artifacts and the build cache,
      # which is most of the wall time on a project with no CI history.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK and run unit tests
        run: ./gradlew assembleDebug testDebugUnitTest

      # The APK is the point of the workflow: a build that succeeds and produces
      # nothing installable is a green tick that means less than it looks like.
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Reports only when something failed: on a green run they are noise, and on
      # a red one they are the only thing that says which test and why.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
