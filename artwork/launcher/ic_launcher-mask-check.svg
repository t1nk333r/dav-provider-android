<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="344" height="104" viewBox="0 0 344 104">
  <title>The shipped launcher icon at true 48 pixel size</title>
  <desc>Circle, squircle and rounded square, on a light launcher and on a dark one.</desc>
  <defs>
    <symbol id="icon" viewBox="0 0 108 108">
      <rect width="108" height="108" fill="#F3E7D3"/>
      <path fill="#14332E" fill-rule="evenodd" d="M26,32 H38 V26 H47 V32 H61 V26 H70 V32 H82 V78 A6,6 0 0 1 76,84 H32 A6,6 0 0 1 26,78 Z M44,48 A10,10 0 1 0 64,48 A10,10 0 1 0 44,48 Z M38,74 V72 A16,12 0 0 1 70,72 V74 Z"/>
    </symbol>
    <clipPath id="circle"><circle cx="54" cy="54" r="54"/></clipPath>
    <clipPath id="squircle"><path d="M54 0C91 0 108 17 108 54C108 91 91 108 54 108C17 108 0 91 0 54C0 17 17 0 54 0Z"/></clipPath>
    <clipPath id="rounded"><rect width="108" height="108" rx="22"/></clipPath>
  </defs>

  <rect width="172" height="104" fill="#FEF7FF"/>
  <rect x="172" width="172" height="104" fill="#141218"/>

  <g>
    <svg x="8" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#circle)"><use xlink:href="#icon"/></g></svg>
    <svg x="64" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#squircle)"><use xlink:href="#icon"/></g></svg>
    <svg x="120" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#rounded)"><use xlink:href="#icon"/></g></svg>
    <svg x="176" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#circle)"><use xlink:href="#icon"/></g></svg>
    <svg x="232" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#squircle)"><use xlink:href="#icon"/></g></svg>
    <svg x="288" y="8" width="48" height="48" viewBox="0 0 108 108"><g clip-path="url(#rounded)"><use xlink:href="#icon"/></g></svg>
  </g>
</svg>
