# Draft of the fdroiddata recipe for DAVKeep, kept here so the merge request is a copy
# rather than a rewrite. Upstream path: metadata/app.davkeep.yml in gitlab.com/fdroid/fdroiddata.
#
# `commit` must be the full hash or the signed tag of the release being built; F-Droid builds from
# source and signs with its own key, so an F-Droid install and a GitHub/Obtainium install of the
# same version are different signatures and cannot replace one another.

